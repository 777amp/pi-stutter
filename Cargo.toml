[package]
name = "pi-stutter"
version = "0.2.0"
edition = "2021"
description = "Lightweight Rust TUI profiler, process lag debugger, and App Nap background freezer for Raspberry Pi"
license = "MIT"
repository = "https://github.com/777amp/pi-stutter"

[lib]
name = "pi_stutter"
path = "src/lib.rs"

[[bin]]
name = "pi-stutter"
path = "src/main.rs"

[[bin]]
name = "pi-nap"
path = "src/bin/pi_nap.rs"

[[bin]]
name = "pi-attach"
path = "src/bin/pi_attach.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
