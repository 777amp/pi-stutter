[package]
name = "pi-stutter"
version = "0.1.0"
edition = "2021"
description = "Lightweight Rust TUI profiler for diagnosing Raspberry Pi micro-stutter, lag, throttling, I/O stalls, and scheduler jitter"
license = "MIT"
repository = "https://github.com/777amp/pi-stutter"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
